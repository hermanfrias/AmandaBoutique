{% extends "BoutiqueApp/base.html" %} {% block content %}
<div class="container my-5">
  <div class="card shadow-lg mx-auto card-auth card-auth-md">
    <div class="card-header text-center bg-pink-lighter">
      Confirmar Eliminación
    </div>
    <div class="card-body text-center">
      <h5>¿Estás seguro de que deseas eliminar esta cotización?</h5>
      <p class="mt-3">
        <strong>Fecha:</strong> {{ cotizacion.fecha|date:"d/m/Y" }}<br />
        <strong>Valor:</strong> {{ cotizacion.valor }} Bs/USD
      </p>
      <div class="d-flex justify-content-center gap-3 mt-4">
        <form method="post">
          {% csrf_token %}
          <button type="submit" class="btn btn-eliminar px-4 py-2">
            Eliminar
          </button>
        </form>
        <a
          href="{% url 'listar_cotizaciones' %}"
          class="btn btn-volver px-4 py-2"
          >Volver</a
        >
      </div>
    </div>
  </div>
</div>
{% endblock %}
