{% extends "BoutiqueApp/index.html" %}
{% load static %}
{% block content %}
<link rel="stylesheet" href="{% static 'flujo/css/flujo.css' %}">
<div class="container py-5">
    <div class="d-flex justify-content-between align-items-center mb-4">
        <h2 class="text-pink fw-bold">Cotizaciones</h2>
        <a href="{% url 'crear_cotizacion' %}" class="btn btn-listar">Agregar</a>
    </div>
    <div class="table-responsive shadow-sm rounded">
        <table class="table table-striped table-bordered text-center">
            <thead><tr><th>Fecha</th><th>Valor (Bs/USD)</th><th>Acciones</th></tr></thead>
            <tbody>
                {% for c in cotizaciones %}
                <tr>
                    <td>{{ c.fecha|date:"d/m/Y" }}</td>
                    <td>{{ c.valor }}</td>
                    <td>
                        <a href="{% url 'editar_cotizacion' c.id %}" class="btn btn-sm btn-editar me-1">Editar</a>
                        <a href="{% url 'eliminar_cotizacion' c.id %}" class="btn btn-sm btn-eliminar" onclick="return confirm('¿Estás seguro de eliminar esta cotización?')">Eliminar</a>
                    </td>
                </tr>
                {% empty %}
                <tr><td colspan="3" class="text-center">No hay cotizaciones</td></tr>
                {% endfor %}
            </tbody>
        </table>
    </div>
</div>
{% endblock %}
