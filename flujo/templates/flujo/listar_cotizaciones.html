{% extends "BoutiqueApp/base.html" %} {% load static %} {% block content %}
<div class="container py-5">
  <div class="d-flex justify-content-between align-items-center mb-4">
    <h2 class="text-pink fw-bold">
      <i class="fas fa-dollar-sign me-2"></i>Cotizaciones
    </h2>
    <div class="btn-group-catalogo">
      <a href="{% url 'crear_cotizacion' %}" class="btn btn-listar">
        <i class="fas fa-plus me-1"></i>Agregar
      </a>
      <a href="{% url 'index' %}" class="btn btn-volver">
        <i class="fas fa-arrow-left me-1"></i>Volver
      </a>
    </div>
  </div>

  <div
    class="table-responsive shadow-lg rounded"
    style="border-radius: 15px; overflow: hidden"
  >
    <style>
      .table-cotizaciones th {
        background: linear-gradient(135deg, #b76e79 0%, #d4a5ae 100%);
        color: white;
        font-weight: 600;
        white-space: nowrap;
        vertical-align: middle;
        border: none;
        padding: 12px 8px;
      }
      .table-cotizaciones td {
        vertical-align: middle;
        padding: 10px 8px;
      }
      .table-cotizaciones tbody tr {
        transition: all 0.2s ease;
      }
      .table-cotizaciones tbody tr:hover {
        background-color: #fff5f7 !important;
        transform: scale(1.01);
        box-shadow: 0 2px 8px rgba(183, 110, 121, 0.15);
      }
      .btn-action-group {
        display: flex;
        gap: 5px;
        justify-content: center;
        flex-wrap: nowrap;
      }
      .btn-action {
        padding: 6px 10px;
        font-size: 0.85rem;
        white-space: nowrap;
        min-width: 65px;
      }
    </style>
    <table
      class="table table-striped table-bordered table-hover table-cotizaciones"
    >
      <thead>
        <tr>
          <th>Fecha</th>
          <th>Valor (Bs/USD)</th>
          <th class="text-center">Acciones</th>
        </tr>
      </thead>
      <tbody>
        {% for c in cotizaciones %}
        <tr>
          <td>{{ c.fecha|date:"d/m/Y" }}</td>
          <td>{{ c.valor }}</td>
          <td class="text-center">
            <div class="btn-action-group">
              <a
                href="{% url 'editar_cotizacion' c.id %}"
                class="btn btn-sm btn-editar btn-action"
              >
                Editar
              </a>
              <a
                href="{% url 'eliminar_cotizacion' c.id %}"
                class="btn btn-sm btn-eliminar btn-action"
                onclick="return confirm('¿Estás seguro de eliminar esta cotización?')"
              >
                Eliminar
              </a>
            </div>
          </td>
        </tr>
        {% empty %}
        <tr>
          <td colspan="3" class="text-center">No hay cotizaciones</td>
        </tr>
        {% endfor %}
      </tbody>
    </table>
  </div>
</div>
{% endblock %}
