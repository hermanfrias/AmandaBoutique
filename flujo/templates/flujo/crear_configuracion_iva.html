{% extends "BoutiqueApp/base.html" %} {% load static %} {% block content %}
<div class="container py-5">
  <!-- Encabezado -->
  <div class="d-flex justify-content-between align-items-center mb-4">
    <h2 class="text-pink fw-bold">
      <i class="fas fa-percent me-2"></i>Crear Configuración de IVA
    </h2>
    <a href="{% url 'listar_configuraciones_iva' %}" class="btn btn-volver">
      <i class="fas fa-arrow-left me-1"></i>Volver
    </a>
  </div>

  <!-- Formulario -->
  <div class="card shadow-sm form-card-standard mx-auto card-auth-md">
    <div class="card-body">
      <form method="POST">
        {% csrf_token %} {{ form.as_p }}
        <div class="text-center mt-4 form-buttons-standard">
          <button type="submit" class="btn btn-pink px-4 py-2">
            <i class="fas fa-save me-1"></i>Guardar
          </button>
          <a
            href="{% url 'listar_configuraciones_iva' %}"
            class="btn btn-volver px-4 py-2"
          >
            <i class="fas fa-arrow-left me-1"></i>Volver
          </a>
        </div>
      </form>
    </div>
  </div>
</div>
{% endblock %}
