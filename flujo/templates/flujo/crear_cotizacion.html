{% extends "BoutiqueApp/base.html" %} 
{% load static %}
{% block content %}
<div class="container py-5">
  <h2 class="text-pink fw-bold mb-4 text-center">Crear Cotización</h2>
  <form method="POST" class="mx-auto" style="max-width: 500px">
    {% csrf_token %} {{ form.as_p }}
    <div class="text-center mt-4">
      <button type="submit" class="btn btn-pink btn-sm me-2">Guardar</button>
      <a href="{% url 'listar_cotizaciones' %}" class="btn btn-editar btn-sm"
        >Volver</a
      >
    </div>
  </form>
</div>
{% endblock %}
