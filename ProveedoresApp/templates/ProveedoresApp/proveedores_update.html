{% extends "BoutiqueApp/base.html" %} {% block content %}
<div class="container my-5">
  <h2 class="text-center mb-4 text-primary-pink-bold">Actualizar Proveedor</h2>
  <div
    class="card shadow-lg mx-auto p-4"
    style="
      max-width: 100%;
      border: 2px solid #f8c8dc;
      border-radius: 15px;
      background-color: #fff;
    "
  >
    <form method="POST">
      {% csrf_token %} {{ form.non_field_errors }}
      <!-- Mostrar los campos del formulario manualmente para personalización -->
      {% for field in form %}
      <div class="mb-3">
        <label
          for="{{ field.id_for_label }}"
          class="form-label text-primary-pink-bold"
        >
          {{ field.label }}
        </label>
        {{ field }} {% if field.errors %}
        <div class="text-danger small">{{ field.errors }}</div>
        {% endif %}
      </div>
      {% endfor %}
      <div class="text-center mt-4">
        <button type="submit" class="btn btn-pink btn-sm me-2">Guardar</button>
        <a href="{% url 'proveedores_list' %}" class="btn btn-editar btn-sm"
          >Volver</a
        >
      </div>
    </form>
  </div>
</div>
{% endblock %}
